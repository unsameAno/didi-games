<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f1d">
<title>마피아 · DIDI Games</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  /* 마피아 — 4~15명. 모바일 우선: 위(단계·발표) / 가운데(참가자 3열·채팅) / 아래 고정(버튼·입력) */
  body { display: flex; flex-direction: column; min-height: 100dvh; touch-action: manipulation; transition: background-color 1.2s; }
  body.night { background-color: #07060f; }
  .head { position: sticky; top: 0; z-index: 6; background: inherit; background-color: var(--bg); padding-bottom: 12px; transition: background-color 1.2s; }
  body.night .head, body.night .acts { background-color: #07060f; }
  .head .top { position: static; gap: 6px; }
  .top h1 { font-size: 15px; }
  .top button { min-height: 36px; padding: 6px 10px; font-size: 12px; margin: 0; display: inline-flex; align-items: center; }
  .top button .pxi { margin: 0; }
  .top button.off { opacity: .4; }
  .col { width: 100%; max-width: 560px; margin: 0 auto; padding: 0 15px; }
  #pin { margin-top: 15px; }
  .wrap { flex: 1; display: flex; flex-direction: column; gap: 18px; padding-top: 6px; padding-bottom: 14px; }
  .qcard { text-align: center; padding: 14px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .qcard .lbl { font-size: 11px; color: var(--muted); font-weight: 700; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .qcard .q { font-size: clamp(18px, 5.4vw, 24px); font-weight: 700; color: var(--yellow); line-height: 1.45; word-break: keep-all; text-shadow: 2px 2px 0 var(--ink); }
  .qcard .sub { font-size: 12px; color: var(--muted); line-height: 1.7; word-break: keep-all; }
  .qcard .ann { font-size: 15px; font-weight: 700; line-height: 1.6; color: var(--text); word-break: keep-all; animation: pop .35s steps(4) both; }
  .qcard .ann.bad { color: #ff9fb0; } .qcard .ann.good { color: var(--mint); } .qcard .ann.news { color: var(--yellow); }
  .qcard .priv { font-size: 12px; font-weight: 700; padding: 6px 10px; background: var(--ink); color: var(--mint); line-height: 1.6; word-break: keep-all; }
  .tbar { width: 100%; height: 8px; background: var(--ink); position: relative; }
  .tbar i { position: absolute; inset: 0 auto 0 0; background: var(--mint); transition: width 1s linear; }
  .tbar.hot i { background: var(--pink); }
  body.night .qcard { background: #0e0c1c; }
  .eyes .q { color: #c9bbff; font-size: clamp(20px, 6vw, 28px); }
  .big-ic { animation: bob 1.2s steps(2) infinite; }
  /* 참가자 3열 */
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 12px; padding: 3px; }
  .pc { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 4px 6px; background: var(--panel); min-height: 0; margin: 0; font-size: 12px; --dc: var(--ink); --dp: 4px; }
  button.pc { --in: 0 0 0 0 transparent; --bc: var(--line); }
  .pc .nm { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; color: var(--text); font-size: 12px; }
  .pc .rl { font-size: 10px; padding: 1px 5px; background: var(--ink); color: var(--muted); font-weight: 700; max-width: 100%; overflow: hidden; white-space: nowrap; }
  .pc .rl.maf { background: var(--pink); color: #fff; } .pc .rl.cit { background: #123d33; color: var(--mint); } .pc .rl.me { background: var(--purple); color: #fff; } .pc .rl.jok { background: var(--yellow); color: #1a1426; }
  .pc.dead { opacity: .4; } .pc.dead .px { filter: grayscale(1); }
  .pc.sel { background: #3b3160; --bc: var(--yellow); }
  .pc.me { --bc: var(--purple); }
  .pc.can { cursor: pointer; }
  .pc:disabled { opacity: 1; cursor: default; } .pc.dead:disabled { opacity: .4; }
  .pc .mk { position: absolute; top: -6px; right: -4px; display: flex; gap: 1px; }
  .pc .mk .px { box-shadow: 0 0 0 2px var(--pink); background: var(--ink); }
  .pc .vt { position: absolute; top: -7px; left: -4px; font-size: 10px; font-weight: 700; background: var(--yellow); color: #1a1426; padding: 1px 5px; }
  /* 설정 */
  .setbox { display: flex; flex-direction: column; gap: 14px; padding: 14px; }
  .setbox h4 { font-size: 12px; color: var(--muted); }
  .srow { display: flex; align-items: center; gap: 10px; justify-content: space-between; font-size: 14px; font-weight: 700; }
  .srow small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; margin-top: 2px; line-height: 1.4; }
  .step { display: flex; align-items: center; gap: 10px; }
  .step button, .sw, .seg button { min-height: 36px; padding: 4px 12px; font-size: 13px; margin: 0; }
  .step b { min-width: 22px; text-align: center; font-size: 16px; }
  .sw { min-width: 58px; background: var(--ink); color: var(--muted); } .sw.on { background: var(--mint); color: #0b2a20; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; } .seg button.on { background: var(--yellow); color: #1a1426; }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; padding: 3px; }
  .roles button { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 8px 10px; text-align: left; font-size: 13px; min-height: 0; margin: 0; background: var(--ink); color: var(--muted); }
  .roles button small { font-size: 10px; font-weight: 400; line-height: 1.4; word-break: keep-all; }
  .roles button.on { background: #2f2752; color: var(--text); --bc: var(--mint); }
  .sum { font-size: 12px; line-height: 1.7; color: var(--text); word-break: keep-all; }
  .warnline { font-size: 12px; color: #ff9fb0; line-height: 1.6; }
  .res { width: 100%; display: flex; flex-direction: column; gap: 6px; text-align: left; }
  .res div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; font-size: 12px; padding: 5px 8px; background: var(--panel2); align-items: center; }
  .res div b { color: var(--yellow); } .res div small { color: var(--muted); font-size: 10px; display: block; grid-column: 1 / -1; word-break: keep-all; }
  .chatc { padding: 12px; } .chatc h3 { margin-bottom: 8px; } .chatc .log { height: 140px; flex: none; }
  .msg.maf { background: #3a1626; --bc: var(--pink); color: #ffb3c4; }
  .acts { position: sticky; bottom: 0; z-index: 5; background-color: var(--bg); padding-top: 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; transition: background-color 1.2s; }
  #btns { display: flex; gap: 12px; padding: 0 3px; } #btns:empty { display: none; }
  #btns button { flex: 1; font-size: 15px; padding: 10px 8px; margin: 0; }
  #btns .msg2 { flex: 1; text-align: center; color: var(--muted); font-size: 12px; padding: 4px; line-height: 1.6; }
  .row { display: flex; gap: 12px; padding: 3px; }
  .row input { flex: 1; min-width: 0; padding: 12px; font-size: 16px; background: var(--ink); outline: none; border: 0; box-shadow: 0 -3px 0 0 var(--line), 0 3px 0 0 var(--line), -3px 0 0 0 var(--line), 3px 0 0 0 var(--line); }
  .row input:disabled { opacity: .45; }
  .row button { flex-shrink: 0; white-space: nowrap; margin: 0; }
  body.eyes #stat, body.eyes .chatc, body.eyes #form, body.eyes #view { display: none; }
  .modal { position: fixed; inset: 0; background: rgba(7,5,14,.86); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 40; }
  .modal .box { width: 100%; max-width: 340px; text-align: center; padding: 22px 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .rolename { font-size: 28px; font-weight: 700; color: var(--yellow); text-shadow: 3px 3px 0 var(--ink); }
  .rolename.maf { color: var(--pink); }
</style>
</head>
<body>
<div class="head">
  <div class="top">
    <span id="logoSlot"></span>
    <h1><i data-ic="moon" data-size="18"></i><span data-t="gameName"></span></h1>
    <span class="code-chip" id="codeChip"></span>
    <span class="grow"></span>
    <button class="btn-yellow hidden" id="roleBtn" data-t="myRole"></button>
    <button class="btn-ghost" id="voiceBtn" title="voice"><i data-ic="sound" data-size="16"></i></button>
    <button class="btn-ghost" id="bgmBtn" title="bgm"><i data-ic="note" data-size="16"></i></button>
    <button class="btn-ghost" id="leaveBtn" data-t="leave"></button>
  </div>
  <div class="col" id="pin"></div>
</div>
<div class="col wrap">
  <div id="view"></div>
  <div id="stat"></div>

</div>
<div class="modal hidden" id="roleModal"><div class="card box" id="roleBox"></div></div>
<canvas id="confetti"></canvas>

      const foot = NG.el('div', 'seg'); foot.style.justifyContent = 'flex-start';
      if (host && !c.auto) { const b = NG.el('button', '', t('reco')); b.addEventListener('click', () => setCfg({ ...reco(Math.max(MIN, n)), extra: {}, auto: true, reveal: true }, false)); foot.appendChild(b); }
      const tb = NG.el('button', '', t('soundTest')); tb.addEventListener('click', () => { Snd.init(); Snd.set('mf-voice', true); Snd.set('mf-bgm', true); syncSndBtns(); Snd.setMood('night'); Snd.speak(SAY[L()].test); setTimeout(() => { Snd.sfx('good'); Snd.setMood(moodOf()); }, 4000); }); foot.appendChild(tb);
      box.appendChild(foot); el.appendChild(box);
    });

    // ── 참가자 칸
    const ids = ph === 'lobby' ? list.map(p => p.id) : order(), p = picksOf(), v = votes[dkey()] || {}, iVoted = myVoteKey === dkey() || !!v[me()];
    const showMk = ph === 'night' && (mafView || (acting && mine === 'mafia') || !aliveMe || !playing);
    draw('stat', ['s', ph, st.gid, st.day, st.step, ids.join(','), alive().join(','), pk, sel, iVoted, acting, pickOf(me()), showMk ? JSON.stringify(p) : '', ph === 'vote' ? Object.keys(v).length : '', JSON.stringify(st.contact || {}), JSON.stringify(st.pub || {}), JSON.stringify((st.seen || {})[me()] || {}), room.hostId(), NG.ui].join('|'), (el) => {
      const g = NG.el('div', 'grid');
      for (const id of ids) {
        const dead = ph !== 'lobby' && !isAlive(id), k = ph === 'lobby' ? '' : known(id), my = pickOf(me());
        const can = (ph === 'vote' && aliveMe && !iVoted && !dead && id !== me()) || (acting && canTarget(id));
        const cell = NG.el('button', 'pc' + (dead ? ' dead' : '') + (id === me() ? ' me' : '') + (can ? ' can' : '') + ((ph === 'vote' && sel === id && !iVoted) || (acting && my === id) ? ' sel' : ''));
        cell.disabled = !can;
        let h = `${person(id, 34)}<span class="nm">${esc(room.nameOf(id))}</span>`;
        h += k ? `<span class="rl ${rlClass(k, id)}">${k === 'no' ? t('polNo') : rn(k)}</span>` : `<span class="rl">${dead ? t('dead') : id === me() ? t('youTag') : ph === 'lobby' && id === room.hostId() ? t('host') : '·'}</span>`;
        if (showMk) { const who = alive().filter(m => roleOf(m) === 'mafia' && p[m] && p[m].t === id); if (who.length) h += `<span class="mk">${who.map(m => person(m, 16)).join('')}</span>`; }
        if (ph === 'vote' && v[id] && !dead) h += `<span class="vt">✓</span>`;
        cell.innerHTML = h; cell.addEventListener('click', () => onCell(id)); g.appendChild(cell);
      }
      el.appendChild(g);
    });

    // ── 아래 버튼
    const vc = Object.keys(v).filter(id => isAlive(id)).length;
    draw('btns', ['b', ph, host, n, cfgErr(c, n), sel, iVoted, vc, aliveMe, playing, st.gid].join('|'), (el) => {
      if (ph === 'lobby') { const err = cfgErr(c, n); if (host) { const b = NG.el('button', 'btn-main', err && n < MIN ? err : t('startBtn')); b.disabled = !!err; b.addEventListener('click', startGame); el.appendChild(b); } else el.appendChild(NG.el('div', 'msg2', n < MIN ? t('need', MIN) : t('waitHost'))); }
      else if (ph === 'day' && host) { const b = NG.el('button', 'btn-ghost', t('skipTalk')); b.addEventListener('click', () => { if (room.isHost && state.phase === 'day') toVote(state); }); el.appendChild(b); }
      else if (ph === 'vote' && aliveMe) { if (iVoted) el.appendChild(NG.el('div', 'msg2', t('voted', vc, alive().length))); else { const b = NG.el('button', 'btn-main', sel ? t('voteBtn') : t('pickFirst')); b.disabled = !sel; b.addEventListener('click', castVote); el.appendChild(b); } }
      else if (ph === 'end') { if (host) { const b = NG.el('button', 'btn-main', t('againBtn')); b.addEventListener('click', () => push({ ...fresh(), lang: state.lang, langSet: true, cfg: { ...cfg() } })); el.appendChild(b); } const h = NG.el('button', 'btn-ghost', t('toLobby')); h.addEventListener('click', leave); el.appendChild(h); }
    });
  }

  // 단계가 바뀔 때: 음성 안내·배경음·진동·발표를 채팅에 기록
  function cue(prev) {
    const st = state, ph = st.phase, S = SAY[L()], k = [st.gid, st.day, ph, st.step].join('|'); if (k === lastCue) return; lastCue = k;
    Snd.setMood(moodOf());
    if (ph !== prev.phase || st.day !== prev.day) { sel = null; try { window.scrollTo({ top: 0 }); } catch {} if (ph !== 'role' && ph !== 'day') showRole = false; }
    if (ph === 'night') { const ss = arr(st.steps), s = ss[st.step || 0];
      if (s === 'all') Snd.speak(S.nightSim); else Snd.speak((st.step ? S.close(S.subj[ss[st.step - 1]]) : S.night) + ' ' + S.subj[s] + ' ' + S.open[s]); }
    else if (ph === 'morning') { const items = arr((st.ann || {}).items); Snd.speak((prev.phase === 'night' && cfg().night === 'seq' ? S.close(S.subj[arr(prev.steps).slice(-1)[0]] || '') + ' ' : '') + S.morning + ' ' + items.map(it => annText(it)[1]).join(' ')); Snd.sfx(items.some(it => it.type === 'kill' || it.type === 'lover') ? 'bad' : 'good'); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {} }
    else if (ph === 'day' && prev.phase !== 'morning') Snd.speak(S.day);
    else if (ph === 'vote') Snd.speak(S.vote);
    else if (ph === 'result') { const items = arr((st.ann || {}).items); Snd.speak(items.map(it => annText(it)[1]).join(' ')); if (items.some(it => it.type === 'exec')) Snd.sfx('bad'); }
    else if (ph === 'end') { Snd.speak(winText()); Snd.sfx(st.winner === 'joker' ? 'joker' : inGame() && iWon() ? 'win' : 'lose'); if (inGame() && iWon()) NG.confetti(); }
  }
  function logAnn() { const a = state.ann || {}; if (!a.n || a.n <= lastAnn) return; lastAnn = a.n; for (const it of arr(a.items)) { const [cls, tx] = annText(it); if (tx) NG.addMsg(cls === 'bad' ? 'close' : cls === 'good' ? 'win' : 'sys', '', tx); } }
  room.on('state', (s) => { const prev = state; state = { ...fresh(), ...(s || {}) }; if (firstState) { firstState = false; lastAnn = (state.ann && state.ann.n) || 0; lastCue = [state.gid, state.day, state.phase, state.step].join('|'); Snd.setMood(moodOf()); } else { logAnn(); cue(prev); if (state.phase === 'end' && prev.phase !== 'end') NG.addMsg('win', '', winText()); } render(); });
  room.on('players', (list, info) => { for (const x of (info && info.notes) || []) NG.addMsg('sys', '', x); render(); });
  room.on('chat', (m) => NG.addMsg('', m.name, m.text));

  room.join(fresh()).then(r => {
    if (r.error) { location.href = 'index.html?err=' + encodeURIComponent(r.error); return; }
    room.listen(room.ref.child('nact'), 'value', (s) => { nact = s.val() || {}; render(); });
    room.listen(room.ref.child('vote'), 'value', (s) => { votes = s.val() || {}; render(); });
    // 마피아 비밀 채팅: 마피아 편(접선한 스파이·마담 포함)과 탈락자·구경꾼에게만 보임
    let seenKey = null;
    room.listen(room.ref.child('mchat').limitToLast(30), 'child_added', (s) => { const m = s.val(); if (!m || (seenKey && s.key <= seenKey)) return; seenKey = s.key; if (m.g !== state.gid) return; if (mafKnown(me()) || !inGame() || !isAlive(me())) NG.addMsg('maf', m.name, m.text); });
    render();
  });
  render();
})();
</script>
</body>
</html>

  .pbtn .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .pbtn.on { background: #3b3160; --bc: var(--yellow); --dc: #8a6d10; }
  .pbtn.on .px { animation: bob .8s steps(2) infinite; }

  .tops { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; padding: 6px 3px; }
  .topc { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 18px 12px; background: var(--panel); min-width: 130px; --bc: var(--yellow); --dc: var(--ink); --dp: 8px; animation: pop .35s steps(4) both; }
  .topc .px { animation: bob 1s steps(2) infinite; }
  .topc b { font-size: 17px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topc .v { font-size: 12px; font-weight: 700; padding: 3px 8px; background: var(--yellow); color: #1a1426; }
  .crown { margin-bottom: -4px; }
  .big-ic { animation: bob 1s steps(2) infinite; }
  .note { text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }
  .endlist { display: flex; flex-direction: column; gap: 16px; padding: 3px; }

`);
  const QS = BASIC.concat(SPICY);                       // 기본 + 매운맛을 섞어서 출제
  const qText = (qi) => (QS[qi] || ['?', '?'])[NG.ui === 'ja' ? 1 : 0];

  NG.addT({
    ko: { gameName: '누구 누구', waitTitle: '친구를 기다리는 중…', waitText: (c) => `친구에게 방 코드 「${c}」를 알려 주세요.<br>노란 코드를 누르면 복사돼요.`,
      need: (n) => `${n}명부터 시작할 수 있어요 (4명 이상 추천)`, waitHost: '방장이 시작하기를 기다리는 중…', startBtn: '게임 시작',
      roundPill: (r, t) => `${r} / ${t}`, pickOne: '첫인상으로 한 명을 골라 주세요', anon: '무기명 투표 · 누가 골랐는지는 아무도 몰라요',
      voteBtn: '투표하기', pickFirst: '한 명을 골라 주세요', votedMsg: (a, b) => `투표 완료! 다른 사람을 기다리는 중… (${a}/${b})`, nextJoin: '지금은 구경 중이에요. 다음 주제부터 참여해요!',
      votes: (n) => `${n}표`, noVotes: '아무도 투표하지 않았어요', tie: '공동 1위!', nextIn: (s) => `다음 주제까지 ${s}초`, lastIn: (s) => `마지막 결과까지 ${s}초`,
      endTitle: '오늘의 첫인상', endSub: '가장 많이 뽑힌 주제예요', mystery: '아직 미스터리한 사람', againBtn: '한 판 더', toLobby: '로비로', players: (n) => `참가자 ${n}명`, youTag: '나' },
    ja: { gameName: 'だれだれ', waitTitle: '友達を待っています…', waitText: (c) => `友達に部屋コード「${c}」を教えてください。<br>黄色いコードを押すとコピーできます。`,
      need: (n) => `${n}人から始められます（4人以上がおすすめ）`, waitHost: 'ホストの開始を待っています…', startBtn: 'ゲーム開始',
      roundPill: (r, t) => `${r} / ${t}`, pickOne: '第一印象で1人選んでください', anon: '匿名投票 · 誰が選んだかは分かりません',
      voteBtn: '投票する', pickFirst: '1人選んでください', votedMsg: (a, b) => `投票完了！みんなを待っています… (${a}/${b})`, nextJoin: '今は見学中です。次のお題から参加します！',
      votes: (n) => `${n}票`, noVotes: '誰も投票しませんでした', tie: '同率1位！', nextIn: (s) => `次のお題まで${s}秒`, lastIn: (s) => `最終結果まで${s}秒`,
      endTitle: '今日の第一印象', endSub: '一番多く選ばれたお題です', mystery: 'まだミステリアスな人', againBtn: 'もう一回', toLobby: 'ロビーへ', players: (n) => `参加者 ${n}人`, youTag: '自分' },
  });
  const $ = (id) => document.getElementById(id), t = NG.t;
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const GAME = 'who', TOTAL = 10, VOTE_SEC = 20, REVEAL_SEC = 7, MIN = 3;
  document.title = `${t('gameName')} · DIDI Games`;

  const code = NG.codeFromHash() || NG.genCode();
  try { history.replaceState(null, '', '#' + code.toLowerCase()); } catch {}
  const room = new NG.Room(GAME, code);
  const fresh = () => ({ phase: 'lobby', gid: 0, round: 0, total: TOTAL, qi: -1, timeLeft: 0, cands: [], result: {}, tops: [], wins: {} });
  let state = fresh();
  // 득표수만 저장한다: tally/{gid_round}/{뽑힌 사람} = 표 수, voted/{gid_round}/{투표한 사람} = true. 누가 누구를 골랐는지는 어디에도 남기지 않음.
  let tally = {}, voted = {}, used = new Set(), sel = null, myVoteKey = null, lastKey = '', celebrated = '';
  const rkey = (st = state) => `${st.gid}_${st.round}`;
  const me = () => NG.me.uid;
  const arr = (x) => Array.isArray(x) ? x : Object.values(x || {});   // Firebase가 배열을 객체로 돌려줘도 안전하게
  const cands = () => arr(state.cands);
  const hasVoted = () => myVoteKey === rkey() || !!((voted[rkey()] || {})[me()]);
  const votedCount = () => cands().filter(id => (voted[rkey()] || {})[id]).length;

  $('logoSlot').outerHTML = NG.logoHTML(true);
  NG.applyText(); $('codeChip').textContent = code; NG.bindCodeChip($('codeChip'), code);
  const leave = async () => { try { await room.leave(); } catch {} location.href = 'index.html'; };
  NG.bindLogo(document, () => room.leave());
  $('leaveBtn').addEventListener('click', leave);

  // ───── 방장: 진행 (1초마다)
  function pickQuestion() {
    let pool = QS.map((_, i) => i).filter(i => !used.has(String(i)));
    if (!pool.length) { used = new Set(); room.ref.child('used').remove().catch(() => {}); pool = QS.map((_, i) => i); }
    const qi = pool[Math.floor(Math.random() * pool.length)];
    used.add(String(qi)); room.ref.child('used/' + qi).set(true).catch(() => {});
    return qi;
  }
  function nextRound(st) {
    const ids = room.active().map(p => p.id);
    if (ids.length < 2) { room.pushState({ ...st, phase: 'end', timeLeft: 0 }); return; }
    room.pushState({ ...st, phase: 'ask', round: st.round + 1, qi: pickQuestion(), cands: ids, timeLeft: VOTE_SEC, result: {}, tops: [] });
  }
  function startGame() {
    if (!room.isHost || room.active().length < MIN) return;
    room.ref.child('tally').remove().catch(() => {}); room.ref.child('voted').remove().catch(() => {});
    nextRound({ ...fresh(), lang: state.lang || NG.ui, langSet: true, gid: Date.now() % 100000000 });
  }
  // 게임 중단(방장): 대기실로 돌아가고 이 판은 칭호·뱃지를 기록하지 않음
  const stopper = NG.bindStop(room, { btn: $('stopBtn'), playing: () => state.phase === 'ask' || state.phase === 'reveal',
    stop: (keep) => { room.ref.child('tally').remove().catch(() => {}); room.ref.child('voted').remove().catch(() => {}); room.pushState({ ...fresh(), ...keep }); } });
  function toReveal(st) {
    const res = {}; const tl = tally[rkey(st)] || {};
    for (const id of arr(st.cands)) if (tl[id] > 0) res[id] = tl[id];
    const max = Math.max(0, ...Object.values(res));
    const tops = max > 0 ? Object.keys(res).filter(id => res[id] === max) : [];
    const wins = { ...(st.wins || {}) };
    for (const id of tops) wins[id] = (wins[id] ? wins[id] + ',' : '') + st.qi + ':' + max;   // "주제번호:표수,…"
    room.pushState({ ...st, phase: 'reveal', timeLeft: REVEAL_SEC, result: res, tops, wins });
  }
  room.setHostLoop(() => {
    const st = room.state; if (!room.isHost || !st) return;
    if (st.phase === 'ask') {
      const here = arr(st.cands).filter(id => room.players[id]);
      const all = here.length > 0 && here.every(id => (voted[rkey(st)] || {})[id]);
      if (all || st.timeLeft <= 1) toReveal(st); else room.pushState({ ...st, timeLeft: st.timeLeft - 1 });
    } else if (st.phase === 'reveal') {
      if (st.timeLeft <= 1) { if (st.round >= st.total) room.pushState({ ...st, phase: 'end', timeLeft: 0 }); else nextRound(st); }
      else room.pushState({ ...st, timeLeft: st.timeLeft - 1 });
    }
  });

  // ───── 투표
  async function castVote() {
    if (!sel || hasVoted() || state.phase !== 'ask' || !cands().includes(me()) || sel === me()) return;
    const k = rkey(), target = sel; myVoteKey = k; render(true);
    try { await room.ref.child(`tally/${k}/${target}`).transaction(v => (v || 0) + 1); await room.ref.child(`voted/${k}/${me()}`).set(true); } catch {}
  }

  // ───── 화면
  const person = (id, size) => `${NG.avatarSVG(room.avOf(id), size)}`;
  function render(force) {
    const st = state, ph = st.phase;
    stopper.sync(st);
    $('roundPill').classList.toggle('hidden', ph === 'lobby' || ph === 'end');
    $('roundPill').textContent = t('roundPill', st.round, st.total || TOTAL);
    const key = [ph, rkey(st), hasVoted(), sel, votedCount(), room.playerList().map(p => p.id).join(','), room.isHost, NG.ui].join('|');
    // 같은 화면이면 타이머만 갱신 (버튼을 매초 다시 그리지 않음)
    if (!force && key === lastKey) {
      const bar = $('tbarFill'); if (bar) { bar.style.width = Math.max(0, (st.timeLeft - 1) / (VOTE_SEC - 1) * 100) + '%'; bar.parentElement.classList.toggle('hot', st.timeLeft <= 5); }
      const cd = $('cd'); if (cd) cd.textContent = t(st.round >= st.total ? 'lastIn' : 'nextIn', st.timeLeft);
      return;
    }
    lastKey = key;
    const view = $('view'), acts = $('acts'); view.innerHTML = ''; acts.innerHTML = '';

    if (ph === 'lobby') {
      const list = room.playerList();
      view.insertAdjacentHTML('beforeend', `<div class="card qcard"><div class="big-ic">${NG.icon('who', 64)}</div><div class="q">${t('waitTitle')}</div><div class="sub">${t('waitText', code)}</div><div class="lbl">${NG.icon('people', 12)} ${t('players', list.length)}</div></div>`);
      const g = NG.el('div', 'grid');
      for (const p of list) { const b = NG.el('div', 'pbtn pxb static'); b.innerHTML = `${person(p.id, 36)}<span class="nm">${esc(room.nameOf(p.id))}</span>${p.id === room.hostId() ? `<span class="tag">${t('host')}</span>` : ''}`; g.appendChild(b); }
      view.appendChild(g);
      if (room.isHost) {
        const ok = room.active().length >= MIN;
        const b = NG.el('button', 'btn-main'); b.disabled = !ok; b.innerHTML = ok ? `${NG.icon('play', 14)}<span>${t('startBtn')}</span>` : `<span style="font-size:13px">${t('need', MIN)}</span>`;
        b.addEventListener('click', startGame); acts.appendChild(b);
      } else acts.appendChild(NG.el('div', 'msg2', room.active().length >= MIN ? t('waitHost') : t('need', MIN)));
    }

    else if (ph === 'ask') {
      const inGame = cands().includes(me()), done = hasVoted();
      view.insertAdjacentHTML('beforeend', `<div class="card qcard"><div class="lbl">Q${st.round}</div><div class="q">${esc(qText(st.qi))}</div><div class="tbar${st.timeLeft <= 5 ? ' hot' : ''}"><i id="tbarFill" style="width:${Math.max(0, (st.timeLeft - 1) / (VOTE_SEC - 1) * 100)}%"></i></div><div class="sub">${t('pickOne')}<br>${t('anon')}</div></div>`);
      const g = NG.el('div', 'grid');
      for (const id of cands()) {
        const mine = id === me();
        const b = NG.el('button', 'pbtn' + (sel === id ? ' on' : '')); b.disabled = mine || done || !inGame;
        b.innerHTML = `${person(id, 40)}<span class="nm">${esc(room.nameOf(id))}</span>${mine ? `<span class="tag">${t('youTag')}</span>` : ''}`;
        b.addEventListener('click', () => { sel = id; render(true); });
        g.appendChild(b);
      }
      view.appendChild(g);
      if (!inGame) acts.appendChild(NG.el('div', 'msg2', t('nextJoin')));
      else if (done) acts.appendChild(NG.el('div', 'msg2', t('votedMsg', votedCount(), cands().length)));
      else { const b = NG.el('button', 'btn-main', sel ? t('voteBtn') : t('pickFirst')); b.disabled = !sel; b.addEventListener('click', castVote); acts.appendChild(b); }
    }

    else if (ph === 'reveal') {
      const tops = arr(st.tops), res = st.result || {};
      view.insertAdjacentHTML('beforeend', `<div class="card qcard"><div class="lbl">Q${st.round}</div><div class="q">${esc(qText(st.qi))}</div>${tops.length > 1 ? `<div class="lbl" style="color:var(--mint)">${t('tie')}</div>` : ''}</div>`);
      if (!tops.length) view.appendChild(NG.el('div', 'note', t('noVotes')));
      else {
        const w = NG.el('div', 'tops');
        tops.forEach((id, i) => { const c = NG.el('div', 'topc pxb'); c.style.animationDelay = (i * 0.12) + 's'; c.innerHTML = `<span class="crown">${NG.icon('crown', 30)}</span>${person(id, 72)}<b>${esc(room.nameOf(id))}</b><span class="v">${t('votes', res[id] || 0)}</span>`; w.appendChild(c); });
        view.appendChild(w);
        if (tops.includes(me()) && celebrated !== rkey(st)) { celebrated = rkey(st); NG.confetti(); }
      }
      const cd = NG.el('div', 'msg2', t(st.round >= st.total ? 'lastIn' : 'nextIn', st.timeLeft)); cd.id = 'cd'; acts.appendChild(cd);
    }

    else if (ph === 'end') {
      view.insertAdjacentHTML('beforeend', `<div class="card qcard"><div class="big-ic">${NG.icon('trophy', 48)}</div><div class="q">${t('endTitle')}</div><div class="sub">${t('endSub')}</div></div>`);
      const wins = st.wins || {}; const ids = [...new Set([...room.playerList().map(p => p.id), ...Object.keys(wins)])];
      const titles = (id) => String(wins[id] || '').split(',').filter(Boolean).map(x => x.split(':').map(Number)).sort((a, b) => b[1] - a[1]).slice(0, 3);
      ids.sort((a, b) => titles(b).length - titles(a).length);
      const w = NG.el('div', 'endlist');
      for (const id of ids) {
        const ts = titles(id); const row = NG.el('div', 'endrow pxb' + (id === me() ? ' me' : ''));
        row.innerHTML = `${person(id, 44)}<div><b>${esc(room.nameOf(id))}</b><ul>${ts.length ? ts.map(([qi]) => `<li>${NG.icon('star', 12)}<span>${esc(qText(qi))}</span></li>`).join('') : `<li class="none">${NG.icon('who', 12)}<span>${t('mystery')}</span></li>`}</ul></div>`;
        w.appendChild(row);
      }
      view.appendChild(w);
      if (room.isHost) { const b = NG.el('button', 'btn-main', t('againBtn')); b.disabled = room.active().length < MIN; b.addEventListener('click', startGame); acts.appendChild(b); }
      const h = NG.el('button', 'btn-ghost', t('toLobby')); h.addEventListener('click', leave); acts.appendChild(h);
    }
  }

  // 게임이 끝나면 내가 받은 칭호를 뱃지로 기록 (한 판에 한 번)
  let badgeGid = 0;
  function badgeEnd() {
    if (!NG.Badge || badgeGid === state.gid || !state.gid) return; badgeGid = state.gid;
    const mine = String((state.wins || {})[me()] || '').split(',').filter(Boolean).map(x => +x.split(':')[0]);
    for (const qi of mine) if (QS[qi]) NG.Badge.addTitle(qi, QS[qi][0], QS[qi][1]);
    NG.Badge.run({ w_plays: 1, w_star: mine.length >= 5, w_none: mine.length === 0 });
  }
  room.on('state', (s) => { const prev = rkey(), pp = state.phase; state = { ...fresh(), ...(s || {}) }; if (rkey() !== prev) sel = null; if (state.phase === 'end' && (pp === 'reveal' || pp === 'ask')) badgeEnd(); render(); });
  room.on('players', () => render());

  room.join(fresh()).then(r => {
    if (r.error) { location.href = 'index.html?err=' + encodeURIComponent(r.error); return; }
    room.listen(room.ref.child('tally'), 'value', (s) => { tally = s.val() || {}; });
    room.listen(room.ref.child('voted'), 'value', (s) => { voted = s.val() || {}; render(); });
    room.listen(room.ref.child('used'), 'value', (s) => { used = new Set(Object.keys(s.val() || {})); });
    render(true);
  });
  render(true);
})();
</script>
</body>

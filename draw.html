<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f1d">
<title>Draw Mind · DIDI Games</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
  .word { font-weight: 900; font-size: 20px; color: var(--text); display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; perspective: 400px; }
  .word.secret { color: var(--mint); letter-spacing: 2px; }
  .word .box {
    display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 44px; margin: 3px 0;
    background: var(--ink); box-shadow: 0 -3px 0 0 var(--line), 0 3px 0 0 var(--line), -3px 0 0 0 var(--line), 3px 0 0 0 var(--line);
    font-size: 22px; font-weight: 900; color: #1a1a1a; position: relative; transform-style: preserve-3d;
  }
  .word .box::after { content: ''; position: absolute; width: 6px; height: 6px; background: var(--muted); opacity: .35; animation: blink 1.6s steps(2) infinite; }
  .word .box.filled { background: var(--yellow); box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink); animation: flip .4s steps(4); }
  .word .box.filled::after { display: none; }
  @keyframes blink { 0%,100% { opacity: .2; transform: scale(.8); } 50% { opacity: .55; transform: scale(1); } }
  @keyframes flip { 0% { transform: rotateX(90deg); opacity: 0; } 60% { transform: rotateX(-15deg); opacity: 1; } 100% { transform: rotateX(0); } }
  .word .meta { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0; margin-left: 6px; padding: 4px 8px; background: var(--panel2); }
  @media (max-width: 760px) {
    .word .box { width: 30px; height: 38px; font-size: 18px; } .word { gap: 9px; }
    /* 힌트 칸은 항상 자기 줄을 차지 → 힌트가 나타나도 상단바 높이가 안 바뀜 */
    /* 그리는 사람: 정답 입력칸을 숨기고(최근 채팅 2줄만 남김) 그림판을 크게 */
    body.can-draw .quick form { display: none; }
    body.can-draw .quick { padding: 6px 10px; gap: 4px; }
    body.can-draw .quick:has(.qlog:empty) { display: none; }
    /* 게임 중: 상단바에서 덜 중요한 것 숨겨 줄 수를 줄임 */
    body.playing #langBadge, body.playing #status { display: none; }
    body.playing .top { gap: 5px; }
    .top .word { order: 20; flex: 0 0 100%; min-height: 46px; justify-content: center; font-size: 16px; }
  }
  /* 그리는 사람: 그림판 위에서는 스크롤·확대·당겨서 새로고침이 일어나지 않게 */
  body.can-draw .stage, body.can-draw canvas#cv { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html.drawing, html.drawing body { overscroll-behavior: none; }

  canvas#cv { width: 100%; height: 100%; display: block; touch-action: none; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .tools:empty { display: none; }
  .tools { gap: 12px; padding: 3px; }
  .swatch { width: 32px; height: 32px; cursor: pointer; box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink); }
  .swatch.on { transform: translateY(-4px); box-shadow: 0 -3px 0 0 #fff, 0 3px 0 0 #fff, -3px 0 0 0 #fff, 3px 0 0 0 #fff, 0 9px 0 0 var(--ink); }
  .size { width: 38px; height: 38px; background: var(--panel2); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 -3px 0 0 var(--ink), 0 3px 0 0 var(--ink), -3px 0 0 0 var(--ink), 3px 0 0 0 var(--ink); }
  .size.on { box-shadow: 0 -3px 0 0 #fff, 0 3px 0 0 #fff, -3px 0 0 0 #fff, 3px 0 0 0 #fff; }
  .size i { display: block; background: #fff; }
  .pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 8px; width: 100%; max-width: 520px; }
  .pick { gap: 14px; padding: 3px; }
  .pick button { background: var(--panel2); padding: 12px 10px; font-size: 16px; display: flex; flex-direction: column; gap: 3px; align-items: center; min-width: 0; }
  .pick button span { word-break: keep-all; line-height: 1.25; }
  @media (hover: hover) { .pick button:hover { --bc: var(--yellow); } }
  .pick button small { font-size: 12px; font-weight: 700; }
  .lv0 small { color: var(--mint); } .lv1 small { color: var(--yellow); } .lv2 small { color: var(--pink); }
  @media (max-width: 760px) {
    .pick { gap: 10px; margin-top: 4px; } .pick button { padding: 8px 6px; font-size: 14px; gap: 1px; min-height: 0; } .pick button small { font-size: 10px; }
  }
</style>
</head>
<body>
<div class="top">
  <span id="logoSlot"></span>
  <h1><i data-ic="palette" data-size="18"></i>Draw Mind</h1>
  <span class="code-chip" id="codeChip">----</span>
  <span class="pill" id="roundPill"></span>
  <span class="pill timer" id="timer">--</span>
  <span class="word" id="word"></span>
  <span class="grow"></span>
  <span class="status" id="status"></span>
  <span class="pill" id="langBadge"></span>
  <span class="pill hidden" id="timeSet">⏱ <select id="timeSel" autocomplete="off"><option value="60">1:00</option><option value="120" selected>2:00</option><option value="180">3:00</option></select></span>
  <button class="btn-main hidden" id="startBtn" style="padding:8px 16px;font-size:16px"></button>
  <button class="btn-danger hidden" id="stopBtn" style="padding:8px 12px;font-size:13px"></button>
  <button class="btn-ghost" id="leaveBtn" style="padding:8px 12px;font-size:13px" data-t="leave"></button>
</div>

<div class="main">
  <div class="board">
    <div class="stage white"><canvas id="cv" width="800" height="600"></canvas><div class="banner" id="banner"><h2></h2><p id="bannerText"></p></div></div>
    <div class="tools" id="tools"></div>
    <div class="quick card" id="quick">
      <div class="qlog" id="qlog"></div>
      <form id="quickForm" autocomplete="off"><input id="quickInput" maxlength="40" enterkeyhint="send"><button class="btn-main" type="submit" data-t="send"></button></form>
    </div>
  </div>
  <div class="side">
    <div class="card"><h3><span data-t="players"></span> <span id="pcount"></span></h3><div class="players" id="players"></div></div>
    <div class="card chat"><h3 data-t="chatTitle"></h3><div class="log" id="log"></div>
      <form id="chatForm" autocomplete="off"><input id="chatInput" maxlength="40"><button class="btn-sub" type="submit" style="padding:8px 14px;font-size:15px" data-t="send"></button></form></div>
  </div>
</div>

  const chosung = (ch) => { const c = ch.charCodeAt(0); return (c >= 0xAC00 && c <= 0xD7A3) ? CHO[Math.floor((c - 0xAC00) / 588)] : ch.toUpperCase(); };
  function hintCells() {
    const w = state.lang === 'ja' ? norm(state.reading || state.word) : norm(state.word);
    const half = state.timeLeft <= (state.drawSec || drawSeconds) / 2; const chars = [...w];
    if (!half) return chars.map(() => '');
    if (state.lang === 'ja') return chars.map((ch, i) => i === 0 ? ch : '');
    return chars.map(chosung);
  }
  function renderHint(meta) { const w = $('word'); w.className = 'word'; w.innerHTML = ''; for (const ch of hintCells()) { const b = NG.el('span', 'box' + (ch ? ' filled' : ''), ch); w.appendChild(b); } w.appendChild(NG.el('span', 'meta', meta)); }
  const isAnswer = (text) => { const n = norm(text); return !!n && (state.accept || []).some(a => norm(a) === n); };
  const isClose = (text) => { const n = norm(text); return n.length >= 2 && (state.accept || []).some(a => norm(a).includes(n)); };
  const shownWord = () => state.lang === 'ja' && state.reading && norm(state.reading) !== norm(state.word) ? `${state.word}（${state.reading}）` : state.word;

  // ───── 그리기
  const cv = $('cv'), ctx = cv.getContext('2d');
  let strokes = [], color = COLORS[0], size = SIZES[1], drawing = false, cur = null, buf = [], flushT = null;
  function redraw() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); for (const s of strokes) paint(s.pts, s.color, s.size); }
  function paint(pts, c, w) {
    if (!pts.length) return; ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0] * cv.width, pts[0][1] * cv.height);
    if (pts.length === 1) ctx.lineTo(pts[0][0] * cv.width + 0.01, pts[0][1] * cv.height);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * cv.width, pts[i][1] * cv.height); ctx.stroke();
  }
  const clearBoard = () => { strokes = []; redraw(); };
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; };
  // iOS 사파리는 touch-action만으로 스크롤이 완전히 안 막힐 때가 있어서 터치 이벤트도 직접 막는다
  const blockTouch = (e) => { if (canDraw()) e.preventDefault(); };
  for (const ev of ['touchstart', 'touchmove']) { cv.addEventListener(ev, blockTouch, { passive: false }); cv.parentElement.addEventListener(ev, (e) => { if (drawing) e.preventDefault(); }, { passive: false }); }
  document.addEventListener('touchmove', (e) => { if (drawing) e.preventDefault(); }, { passive: false });
  cv.addEventListener('pointerdown', (e) => {
    if (!canDraw()) return;
    e.preventDefault();
    NG.layoutLock = true;                                   // 그리는 동안 그림판 크기 고정
    document.documentElement.classList.add('drawing');
    cv.setPointerCapture(e.pointerId); drawing = true;
    const p = pos(e); cur = { pts: [p], color, size }; strokes.push(cur); paint([p], color, size); buf = [p]; scheduleFlush();
  });
  cv.addEventListener('pointermove', (e) => { if (!drawing || !cur) return; const p = pos(e); paint([cur.pts[cur.pts.length - 1], p], color, size); cur.pts.push(p); buf.push(p); if (buf.length >= 40) flush(); });
  const stop = () => { if (!drawing) return; drawing = false; flush(); cur = null; document.documentElement.classList.remove('drawing'); setTimeout(() => { NG.layoutLock = false; }, 800); };
  cv.addEventListener('pointerup', stop); cv.addEventListener('pointercancel', stop);
  function scheduleFlush() { if (!flushT) flushT = setTimeout(flush, 60); }
  function flush() {
    clearTimeout(flushT); flushT = null;
    if (!buf.length) { buf = cur ? [cur.pts[cur.pts.length - 1]] : []; return; }
    const pts = buf.map(p => [+p[0].toFixed(4), +p[1].toFixed(4)]);
    room.ref.child('strokes').push({ by: NG.me.uid, round: state.round, pts, color, size }).catch(() => {});
    buf = cur ? [cur.pts[cur.pts.length - 1]] : []; if (drawing) scheduleFlush();
  }
  function renderTools() {
    const w = $('tools'); w.innerHTML = ''; if (!canDraw()) return;
    for (const c of COLORS) { const b = NG.el('div', 'swatch' + (c === color ? ' on' : '')); b.style.background = c; b.addEventListener('click', () => { color = c; renderTools(); }); w.appendChild(b); }
    for (const s of SIZES) { const b = NG.el('div', 'size' + (s === size ? ' on' : '')); const i = NG.el('i'); i.style.width = i.style.height = (s + 2) + 'px'; b.appendChild(i); b.addEventListener('click', () => { size = s; renderTools(); }); w.appendChild(b); }
    const clr = NG.el('button', 'btn-ghost', t('clear')); clr.addEventListener('click', () => { clearBoard(); room.ref.child('strokes').remove().catch(() => {}); }); w.appendChild(clr);
  }

  // ───── 화면
  function render() {
    const act = room.active(); const amPlayer = act.some(p => p.id === NG.me.uid);
    NG.renderPlayers(room, $('players'), { tagOf: (id) => state.drawer === id && state.phase !== 'lobby' ? t('drawing') : null, scoreOf: (id) => t('pts', (state.scores || {})[id] || 0), hl: (id) => state.drawer === id && state.phase === 'draw' });
    $('pcount').textContent = `${act.length}/${room.maxPlayers}`;
    $('langBadge').textContent = t('roomLang', state.lang || NG.ui);
    const drawerName = state.drawer ? room.nameOf(state.drawer) : ''; const timerEl = $('timer'), wordEl = $('word');
    timerEl.classList.remove('hot');
    if (state.phase === 'lobby') { $('roundPill').textContent = t('lobby'); timerEl.textContent = '--'; wordEl.textContent = ''; }
    else if (state.phase === 'end') { $('roundPill').textContent = t('end'); timerEl.textContent = '--'; wordEl.textContent = ''; }
    else if (state.phase === 'pick') { $('roundPill').textContent = t('round', state.round + 1, state.totalRounds, drawerName); timerEl.textContent = `⏱ ${state.timeLeft}`; wordEl.className = 'word'; wordEl.textContent = t('picking'); }
    else {
      $('roundPill').textContent = t('round', state.round + 1, state.totalRounds, drawerName);
      timerEl.textContent = state.phase === 'draw' ? `⏱ ${NG.fmtTime(state.timeLeft)}` : t('answerTag');
      timerEl.classList.toggle('hot', state.phase === 'draw' && state.timeLeft <= 10);
      const len = [...norm(state.lang === 'ja' ? (state.reading || state.word) : state.word)].length;
      if (amDrawer() || state.phase === 'reveal') { wordEl.className = 'word secret'; wordEl.textContent = shownWord(); }
      else renderHint(`${t('chars', len)} · ${catName(state.category)} · ${lvName(state.level)}`);
    }
    const banner = $('banner'), h2 = banner.querySelector('h2'), bt = $('bannerText'); banner.classList.remove('hidden');
    if (state.phase === 'lobby') { h2.textContent = act.length < 2 ? t('waitFriends') : t('ready'); bt.textContent = act.length < 2 ? t('shareCode', code) : (room.isHost ? t('pressStart') : t('waitHost', room.nameOf(room.hostId()))); }
    else if (state.phase === 'pick') {
      if (amDrawer()) {
        h2.textContent = t('pickTitle'); bt.innerHTML = ''; const wrap = NG.el('div', 'pick');
        (state.candidates || []).forEach((c, i) => {
          const b = NG.el('button', 'lv' + c.level); b.appendChild(NG.el('span', '', c.reading && norm(c.reading) !== norm(c.word) ? `${c.word}（${c.reading}）` : c.word));
          b.appendChild(NG.el('small', '', `${lvName(c.level)} · ${catName(c.category)} · ${t('pts', LEVEL_PTS[c.level])}`));
          b.addEventListener('click', () => room.ref.child('pick').set({ by: NG.me.uid, round: state.round, idx: i }).catch(() => {})); wrap.appendChild(b);
        });
        bt.appendChild(wrap); const note = NG.el('div', 'muted', t('pickNote', state.timeLeft)); note.style.cssText = 'margin-top:10px;font-size:13px'; bt.appendChild(note);
      } else { h2.textContent = t('pickingBy', drawerName); bt.textContent = t('pleaseWait'); }
    }
    else if (state.phase === 'draw') banner.classList.add('hidden');
    else if (state.phase === 'reveal') { h2.textContent = state.winner ? t('correctBy', room.nameOf(state.winner)) : t('timeUp'); bt.innerHTML = ''; bt.appendChild(NG.el('div', 'big', shownWord())); }
    else if (state.phase === 'end') {
      const ranked = act.map(p => [room.nameOf(p.id), (state.scores || {})[p.id] || 0]).sort((a, b) => b[1] - a[1]);
      h2.textContent = t('winner', ranked[0] ? ranked[0][0] : '-'); bt.textContent = ranked.map((r, i) => `${t('ranks')[i] || (i + 1)} ${r[0]} ${t('pts', r[1])}`).join('  ·  ');
    }
    const inLobby = state.phase === 'lobby' || state.phase === 'end';
    $('startBtn').classList.toggle('hidden', !(room.isHost && inLobby && act.length >= 2)); $('startBtn').textContent = state.phase === 'end' ? t('again') : t('start');
    $('stopBtn').classList.toggle('hidden', !(room.isHost && !inLobby)); if (!stopArmed) $('stopBtn').textContent = t('stop');
    $('timeSet').classList.toggle('hidden', !inLobby); $('timeSel').disabled = !room.isHost; if (state.drawSec) $('timeSel').value = String(state.drawSec);
    const ph = amDrawer() ? t('phNoHint') : (state.phase === 'draw' ? t('phAnswer') : t('phChat'));
    $('chatInput').placeholder = $('quickInput').placeholder = ph; $('chatInput').disabled = $('quickInput').disabled = !amPlayer && state.phase === 'draw';
    document.body.classList.toggle('can-draw', canDraw());
    document.body.classList.toggle('playing', state.phase === 'draw' || state.phase === 'pick' || state.phase === 'reveal');
    NG.layoutHold = state.phase === 'draw' || state.phase === 'pick' || state.phase === 'reveal';   // 게임 중엔 그림판 크기 유지
    renderTools();
    // 단계가 바뀔 때(도구가 생기거나 사라질 때) 한 번만 크기를 다시 맞추고, 그 단계 안에서는 고정
    const lkey = state.phase + '|' + canDraw();
    if (NG.syncLayout) NG.syncLayout(lkey !== render._lkey); render._lkey = lkey;
  }

  // ───── 호스트
  function entry(lang, raw, cat, level) { if (lang === 'ja') { const [word, reading, ...alts] = raw; return { word, reading, accept: [word, reading, ...alts], category: cat, level }; } return { word: raw, reading: '', accept: [raw], category: cat, level }; }
  // 같은 방에서 한 번 후보로 나온 제시어는 다시 안 나옴 (rooms/draw/{code}/used, 방이 비면 초기화)
  let usedWords = new Set();
  const usedKey = (w) => String(w).replace(/[.#$/\[\]]/g, '_');
  function pickOne(lang, level, avoid) {
    const book = WORDS[lang][level]; const all = [];
    for (const c of Object.keys(book)) for (const raw of book[c]) all.push(entry(lang, raw, c, level));
    let pool = all.filter(e => !avoid.has(e.word) && !usedWords.has(usedKey(e.word)));
    if (!pool.length) {   // 이 난이도를 다 썼으면 이 난이도만 처음부터 다시
      const upd = {}; for (const e of all) { usedWords.delete(usedKey(e.word)); upd[usedKey(e.word)] = null; }
      room.ref.child('used').update(upd).catch(() => {});
      pool = all.filter(e => !avoid.has(e.word));
    }
    const e = pool[Math.floor(Math.random() * pool.length)]; avoid.add(e.word); return e;
  }
  const makeCandidates = (lang) => { const a = new Set(); return [pickOne(lang, 0, a), pickOne(lang, 1, a), pickOne(lang, 1, a), pickOne(lang, 2, a)]; };
  function startGame() { const ids = room.active().map(p => p.id); state = { ...fresh(), lang: state.lang, langSet: true, order: ids, totalRounds: ids.length * ROUNDS_PER_PLAYER, scores: {}, drawSec: drawSeconds }; beginRound(0); }
  function beginRound(r) {
    const alive = state.order.filter(id => room.players[id]);
    if (alive.length < 2) { state.phase = 'lobby'; room.pushState(state); return; }
    if (r >= state.totalRounds) return endGame();
    state.round = r; state.drawer = alive[r % alive.length]; state.candidates = makeCandidates(state.lang || 'ko');
    { const upd = {}; for (const c of state.candidates) { usedWords.add(usedKey(c.word)); upd[usedKey(c.word)] = true; } room.ref.child('used').update(upd).catch(() => {}); }
    Object.assign(state, { word: '', reading: '', accept: [], category: '', level: 1, phase: 'pick', timeLeft: PICK_SECONDS, winner: null });
    room.ref.child('strokes').remove().catch(() => {}); room.ref.child('pick').remove().catch(() => {}); room.pushState(state);
  }
  function beginDraw(idx) { const c = (state.candidates || [])[idx] || (state.candidates || [])[0]; if (!c) return beginRound(state.round + 1); Object.assign(state, { word: c.word, reading: c.reading || '', accept: c.accept || [c.word], category: c.category, level: c.level, phase: 'draw', timeLeft: state.drawSec || drawSeconds }); room.pushState(state); }
  function endRound(winner) { state.scores = state.scores || {}; const base = LEVEL_PTS[state.level] || 15; if (winner) { state.scores[winner] = (state.scores[winner] || 0) + base + Math.ceil(state.timeLeft / 8); state.scores[state.drawer] = (state.scores[state.drawer] || 0) + Math.round(base / 2); } state.winner = winner; state.phase = 'reveal'; state.timeLeft = REVEAL_SECONDS; room.pushState(state); }
  function endGame() {
    state.phase = 'end'; room.pushState(state);
    const alive = state.order.filter(id => room.players[id]); const ranked = alive.map(id => [id, state.scores[id] || 0]).sort((a, b) => b[1] - a[1]);
    if (alive.length > 1) NG.recordResult(GAME, { winner: ranked[0] && ranked[0][1] > 0 ? ranked[0][0] : null, players: alive, scores: Object.fromEntries(alive.map(id => [id, state.scores[id] || 0])) });
  }
  room.setHostLoop(() => {
    if (state.phase === 'pick') { if (!room.players[state.drawer]) return beginRound(state.round + 1); state.timeLeft--; if (state.timeLeft <= 0) return beginDraw(0); room.pushState(state); }
    else if (state.phase === 'draw') { if (!room.players[state.drawer]) return endRound(null); state.timeLeft--; if (state.timeLeft <= 0) return endRound(null); room.pushState(state); }
    else if (state.phase === 'reveal') { state.timeLeft--; if (state.timeLeft <= 0) beginRound(state.round + 1); }
  });
  function hostOnChat(m) { if (!room.isHost || state.phase !== 'draw' || m.by === state.drawer || !(state.order || []).includes(m.by)) return; if (m.round === state.round && isAnswer(m.text)) endRound(m.by); }
  let stopArmed = false, stopT = null;
  $('startBtn').addEventListener('click', () => { if (room.isHost) startGame(); });
  $('stopBtn').addEventListener('click', () => {
    if (!room.isHost) return;
    if (!stopArmed) { stopArmed = true; $('stopBtn').textContent = t('stopConfirm'); clearTimeout(stopT); stopT = setTimeout(() => { stopArmed = false; render(); }, 3000); return; }
    stopArmed = false; clearTimeout(stopT); state = { ...fresh(), lang: state.lang, langSet: true, drawSec: state.drawSec }; room.ref.child('strokes').remove().catch(() => {}); room.ref.child('pick').remove().catch(() => {}); room.pushState(state); NG.addMsg('sys', '', t('stopped'));
  });
  $('timeSel').addEventListener('change', () => { if (!room.isHost) return; drawSeconds = +$('timeSel').value; state.drawSec = drawSeconds; room.pushState(state); });
  $('leaveBtn').addEventListener('click', async () => { await room.leave(); location.href = 'index.html'; });

  // ───── 채팅
  const send = (v) => { v = String(v || '').trim(); if (!v) return; if (amDrawer() && isAnswer(v)) { NG.addMsg('sys', '', t('noHint')); return; } room.sendChat(v, { round: state.round }).catch(() => NG.addMsg('sys', '', t('sendFail'))); };
  $('chatForm').addEventListener('submit', e => { e.preventDefault(); send($('chatInput').value); $('chatInput').value = ''; });
  $('quickForm').addEventListener('submit', e => { e.preventDefault(); send($('quickInput').value); $('quickInput').value = ''; $('quickInput').focus(); });

  // ───── 연결
  room.on('players', (list, info) => { if (info && info.connected != null) { $('status').textContent = t(info.connected ? 'connected' : 'connecting'); $('status').className = 'status' + (info.connected ? ' on' : ''); } for (const n of (info && info.notes) || []) NG.addMsg('sys', '', n); render(); })
      .on('state', (s) => {
        state = { ...fresh(), ...(s || {}), scores: (s && s.scores) || {}, order: (s && s.order) || [], accept: (s && s.accept) || [], candidates: (s && s.candidates) || [] };
        if (state.drawSec) drawSeconds = state.drawSec;
        if (state.round !== lastSeenRound || state.phase === 'lobby') { if (state.phase === 'pick' && state.round !== lastSeenRound) NG.addMsg('sys', '', t('turn', state.round + 1, room.nameOf(state.drawer))); lastSeenRound = state.round; }
        if (state.phase === 'reveal' && state.winner && !render._c) { render._c = true; NG.confetti(); } if (state.phase !== 'reveal') render._c = false;
        render(); })
      .on('chat', (m) => {
        const text = String(m.text || '').slice(0, 40); const nm = room.nameOf(m.by) === '?' ? m.name : room.nameOf(m.by);
        if (state.phase === 'draw' && m.by !== state.drawer && isAnswer(text)) NG.addMsg('win', '', t('correctBy', nm));
        else if (state.phase === 'draw' && isClose(text)) NG.addMsg('close', nm, ' ' + text + '  ' + t('close'));
        else NG.addMsg('', nm, ' ' + text);
        hostOnChat(m);
      });
  room.join(fresh()).then(r => {
    if (r.error) { location.href = 'index.html?err=' + encodeURIComponent(r.error); return; }
    room.listen(room.ref.child('used'), 'value', (s) => { usedWords = new Set(Object.keys(s.val() || {})); });
    room.listen(room.ref.child('pick'), 'value', (s) => { const v = s.val(); if (room.isHost && state.phase === 'pick' && v && v.by === state.drawer && v.round === state.round) beginDraw(+v.idx || 0); });
    room.listen(room.ref.child('strokes'), 'value', (s) => {
      const all = s.val() || {};
      strokes = Object.values(all).filter(st => st && Array.isArray(st.pts) && st.round === state.round).map(st => ({ pts: st.pts.filter(p => Array.isArray(p) && p.length === 2).map(p => [+p[0], +p[1]]), color: COLORS.includes(st.color) ? st.color : COLORS[0], size: SIZES.includes(st.size) ? st.size : 9 }));
      if (cur && drawing) strokes.push(cur); redraw();
    });
    render();
  });
  redraw(); render();
})();
</script>
</body>
</html>
